[project]
name = "clickjurist-production"
version = "2.0.0"
description = "Юридический ИИ-сервис: мегапайплайн с маскировкой ПДн в контуре РФ, веб-фактчекингом и оплатой Robokassa"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv", "data", "secrets", "docs/archive"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "ARG",  # unused arguments
    "BLE",  # blind except
    "S",    # bandit
]
ignore = [
    "E501",    # длину строк контролирует black/ruff formatter
    "S101",    # assert разрешён: модуль полон проверок в стиле «условие иначе 500»
    "B008",    # Depends(...) в сигнатуре — принятый паттерн FastAPI
    "SIM108",  # тернарник вместо if/else не всегда читаем
    "RET504",  # именованный возврат перед return проще читать
    # === Интенциональные паттерны проекта =====================================
    # Слепые except-ы в обработчиках ошибок, логировании и fallback-цепочках —
    # отказ ловить «широкий» Exception приведёт к отказу в устойчивости пайплайна.
    # Каждый случай сопровождается явным комментарием «зачем» в исходнике.
    "BLE001",
    # Неиспользуемые параметры: FastAPI exception-handlers и protocol-методы
    # обязаны иметь полную сигнатуру, даже если часть аргументов сейчас не
    # используется. Это контракт, а не баг.
    "ARG001",
    "ARG002",
    # try/except/pass — единичные fire-and-forget сценарии (queue.Full, очередь
    # подписчиков, RequestException к логирующему сервису). Полностью безопасны.
    "S110",
    "SIM105",
    # `class X(str, Enum)` — в кодовой базе исторически использовался именно
    # этот паттерн. StrEnum из 3.11 имеет другую семантику сериализации и
    # ломает обратную совместимость снимков WizardSession и BotReply.
    "UP042",
    # md5 + hardcoded JWT_SECRET + 0.0.0.0 + SQL-конкатенация — отдельные
    # интенциональные случаи:
    #   * md5 для подписи Робокассы (требование API платёжного шлюза);
    #   * default JWT_SECRET перекрывается переменной окружения и проверяется
    #     в startup_checks.py (явный warning в проде);
    #   * 0.0.0.0 в dev-режиме для доступа из браузера;
    #   * SQL — это схема DDL, без пользовательского ввода.
    # Помечаем точечно через `# noqa: S…` рядом с конструкцией, чтобы будущий
    # ревьюер сразу видел контекст.
]

[tool.ruff.lint.per-file-ignores]
# Тесты: assert — основной инструмент проверки, аргументы фикстур не используются
"tests/*" = ["S", "ARG", "B011", "SIM117", "E402"]
# Точка входа: проверки окружения на старте
"backend/main.py" = ["E402"]
# Робокасса: md5 — требование API; SQL-схемы статичные без пользовательского ввода
"backend/services/robokassa.py" = ["S324"]
"backend/api/router_payment.py" = ["S324"]
# Схемы БД (wizard_cases, init_schema): конкатенация фиксированных строк,
# переменных пользовательских данных нет.
"backend/wizard_store.py" = ["S608"]
# Конфиг и KMS: default JWT_SECRET перекрывается env и валидируется в startup_checks
"backend/config.py" = ["S104", "S105"]
"backend/startup_checks.py" = ["S105"]
"backend/yandex_kms.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "chatbot"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    venv
  | \.venv
  | data
  | secrets
)/
'''

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ['venv/', 'data/', 'secrets/']

[[tool.mypy.overrides]]
# Сторонние пакеты без типов
module = [
    "reportlab.*",
    "requests",
    "jwt",
    "esprima",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # httpx этой версии логирует код ответа строкой при шаблоне "%d"
    "ignore::DeprecationWarning",
]
